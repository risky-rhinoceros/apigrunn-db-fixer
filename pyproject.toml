# Not a package — fix_cache.py is a standalone script with no dependencies at
# all. This file exists only so the tests have an environment: `uv run pytest`.
#
# apigrunn is here as the tests' oracle, never as something the script imports:
# the suite holds its parser to apigrunn's output and opens every converted
# database with the real Cache. Bump the pin when a new release lands, and let
# the suite say whether the conversion still produces a file it accepts.

[project]
name = "apigrunn-db-fixer"
version = "0.1.0"
description = "Convert an apigrunn cache from schema version 2 to version 3"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.sources]
apigrunn = { git = "https://github.com/evoso-software/apigrunn", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "apigrunn",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fix_cache.py sits at the repo root rather than in a package.
pythonpath = ["."]
